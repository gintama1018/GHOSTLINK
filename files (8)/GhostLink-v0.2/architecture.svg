<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'SF Mono', Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8FA3C8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F0A93E"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4CD9D0"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B18CFF"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#0D1321"/>

  <text x="480" y="34" text-anchor="middle" fill="#E9EDF7" font-size="20" font-weight="600" letter-spacing="0.5">GhostLink — Zero-RF Architecture</text>
  <text x="480" y="54" text-anchor="middle" fill="#6C7A99" font-size="12">optical · ultrasonic · magnetic — no wifi / bluetooth / cellular</text>

  <!-- Sender column -->
  <rect x="30" y="90" width="220" height="56" rx="6" fill="#161F35" stroke="#2A3654"/>
  <text x="140" y="123" text-anchor="middle" fill="#E9EDF7" font-size="14">Sender App</text>

  <rect x="30" y="176" width="220" height="56" rx="6" fill="#161F35" stroke="#2A3654"/>
  <text x="140" y="200" text-anchor="middle" fill="#E9EDF7" font-size="13">Chunker</text>
  <text x="140" y="217" text-anchor="middle" fill="#6C7A99" font-size="10">index · checksum · payload</text>

  <rect x="30" y="262" width="220" height="56" rx="6" fill="#161F35" stroke="#3B4C78"/>
  <text x="140" y="286" text-anchor="middle" fill="#E9EDF7" font-size="13">Channel Manager</text>
  <text x="140" y="303" text-anchor="middle" fill="#6C7A99" font-size="10">handshake · negotiate · verify</text>

  <!-- Sender encoders -->
  <rect x="10" y="360" width="130" height="50" rx="6" fill="#241C0E" stroke="#F0A93E"/>
  <text x="75" y="381" text-anchor="middle" fill="#F0A93E" font-size="11">Optical</text>
  <text x="75" y="396" text-anchor="middle" fill="#F0A93E" font-size="11">Encoder</text>

  <rect x="150" y="360" width="130" height="50" rx="6" fill="#0E2422" stroke="#4CD9D0"/>
  <text x="215" y="381" text-anchor="middle" fill="#4CD9D0" font-size="11">Ultrasonic</text>
  <text x="215" y="396" text-anchor="middle" fill="#4CD9D0" font-size="11">Encoder</text>

  <rect x="80" y="440" width="130" height="50" rx="6" fill="#1C1730" stroke="#B18CFF"/>
  <text x="145" y="461" text-anchor="middle" fill="#B18CFF" font-size="11">Magnetic</text>
  <text x="145" y="476" text-anchor="middle" fill="#B18CFF" font-size="11">Pulse (Motor)</text>

  <!-- Receiver column -->
  <rect x="710" y="90" width="220" height="56" rx="6" fill="#161F35" stroke="#2A3654"/>
  <text x="820" y="123" text-anchor="middle" fill="#E9EDF7" font-size="14">Receiver App</text>

  <rect x="710" y="176" width="220" height="56" rx="6" fill="#161F35" stroke="#2A3654"/>
  <text x="820" y="200" text-anchor="middle" fill="#E9EDF7" font-size="13">Reassembly Engine</text>
  <text x="820" y="217" text-anchor="middle" fill="#6C7A99" font-size="10">gap detect · file checksum</text>

  <rect x="710" y="262" width="220" height="56" rx="6" fill="#161F35" stroke="#3B4C78"/>
  <text x="820" y="286" text-anchor="middle" fill="#E9EDF7" font-size="13">Channel Manager</text>
  <text x="820" y="303" text-anchor="middle" fill="#6C7A99" font-size="10">handshake · negotiate · verify</text>

  <!-- Receiver decoders -->
  <rect x="820" y="360" width="130" height="50" rx="6" fill="#241C0E" stroke="#F0A93E"/>
  <text x="885" y="381" text-anchor="middle" fill="#F0A93E" font-size="11">Optical</text>
  <text x="885" y="396" text-anchor="middle" fill="#F0A93E" font-size="11">Decoder (cam)</text>

  <rect x="680" y="360" width="130" height="50" rx="6" fill="#0E2422" stroke="#4CD9D0"/>
  <text x="745" y="381" text-anchor="middle" fill="#4CD9D0" font-size="11">Ultrasonic</text>
  <text x="745" y="396" text-anchor="middle" fill="#4CD9D0" font-size="11">Decoder (mic)</text>

  <rect x="750" y="440" width="130" height="50" rx="6" fill="#1C1730" stroke="#B18CFF"/>
  <text x="815" y="461" text-anchor="middle" fill="#B18CFF" font-size="11">Magnetic</text>
  <text x="815" y="476" text-anchor="middle" fill="#B18CFF" font-size="11">Decoder (magnetometer)</text>

  <!-- Physical channel middle strip -->
  <text x="480" y="392" text-anchor="middle" fill="#F0A93E" font-size="11">screen ⇢ camera</text>
  <text x="480" y="437" text-anchor="middle" fill="#4CD9D0" font-size="11">speaker ⇢ mic</text>
  <text x="480" y="482" text-anchor="middle" fill="#B18CFF" font-size="11">motor ⇢ magnetometer</text>

  <!-- vertical connectors sender box to sender encoders -->
  <path d="M140,318 L140,340 L75,340 L75,358" fill="none" stroke="#3B4C78" marker-end="url(#arrow)"/>
  <path d="M140,318 L140,340 L215,340 L215,358" fill="none" stroke="#3B4C78" marker-end="url(#arrow)"/>
  <path d="M140,318 L140,420 L145,420 L145,438" fill="none" stroke="#3B4C78" marker-end="url(#arrow)"/>

  <!-- vertical connectors receiver box to receiver decoders -->
  <path d="M820,318 L820,340 L885,340 L885,358" fill="none" stroke="#3B4C78" marker-end="url(#arrow)"/>
  <path d="M820,318 L820,340 L745,340 L745,358" fill="none" stroke="#3B4C78" marker-end="url(#arrow)"/>
  <path d="M820,318 L820,420 L815,420 L815,438" fill="none" stroke="#3B4C78" marker-end="url(#arrow)"/>

  <!-- horizontal channel lines across the gap -->
  <line x1="140" y1="385" x2="820" y2="385" stroke="#F0A93E" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <line x1="280" y1="385" x2="680" y2="385" stroke="#4CD9D0" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowCyan)" transform="translate(0,45)"/>
  <line x1="210" y1="465" x2="750" y2="465" stroke="#B18CFF" stroke-width="1.5" marker-end="url(#arrowViolet)" marker-start="url(#arrowViolet)"/>

  <!-- top-level arrows -->
  <path d="M250,118 L710,118" fill="none" stroke="#2A3654" stroke-width="1"/>
  <text x="480" y="112" text-anchor="middle" fill="#3B4C78" font-size="10">(no RF link — physical channels only, below)</text>

  <path d="M140,146 L140,176" fill="none" stroke="#3B4C78" marker-end="url(#arrow)"/>
  <path d="M140,232 L140,262" fill="none" stroke="#3B4C78" marker-end="url(#arrow)"/>
  <path d="M820,146 L820,176" fill="none" stroke="#3B4C78" marker-end="url(#arrow)"/>
  <path d="M820,232 L820,262" fill="none" stroke="#3B4C78" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="30" y="530" width="14" height="14" fill="#241C0E" stroke="#F0A93E"/>
  <text x="52" y="541" fill="#8FA3C8" font-size="11">Optical — bulk (primary), ~1–20 KB/s</text>

  <rect x="330" y="530" width="14" height="14" fill="#0E2422" stroke="#4CD9D0"/>
  <text x="352" y="541" fill="#8FA3C8" font-size="11">Ultrasonic — bulk (fallback), ~0.5–5 KB/s</text>

  <rect x="650" y="530" width="14" height="14" fill="#1C1730" stroke="#B18CFF"/>
  <text x="672" y="541" fill="#8FA3C8" font-size="11">Magnetic — handshake only, bits/s</text>

  <text x="480" y="575" text-anchor="middle" fill="#4A587F" font-size="10">GhostLink v0.1 — reference architecture</text>
</svg>
